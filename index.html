<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Efeito de scroll de página de produto — só com CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="intro">
    <p class="kicker">Nimbus · fone sem fio</p>
    <h1>Role para baixo</h1>
  </header>

  <!-- 1. A seção alta dá espaço para rolar -->
  <section class="cena">
    <!-- 2. O palco fica preso na tela com position: sticky -->
    <div class="palco">
      <svg class="produto" viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f4f4f5"/><stop offset="1" stop-color="#a1a1aa"/>
          </linearGradient>
        </defs>
        <path d="M40 110 V90 a60 60 0 0 1 120 0 V110" fill="none" stroke="url(#metal)" stroke-width="12" stroke-linecap="round"/>
        <rect x="22" y="100" width="40" height="64" rx="18" fill="url(#metal)"/>
        <rect x="138" y="100" width="40" height="64" rx="18" fill="url(#metal)"/>
      </svg>
      <!-- 3. O texto que se revela com o scroll -->
      <h2 class="revela">Som que preenche a sala inteira.</h2>
    </div>
  </section>

  <footer class="fim"><p>Fim da demonstração · código em style.css</p></footer>
</body>
</html>
